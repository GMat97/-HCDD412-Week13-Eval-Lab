
name: evals

on: [pull_request]

jobs:
  evals:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Start mock LLM and wait for health check
        run: |
          python mock_llm/server.py &
          for i in {1..30}; do
            if curl --fail --silent http://localhost:9000/health; then
              echo "Mock LLM is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Mock LLM failed to start"
          exit 1

      - name: Run unit tests
        run: pytest

      - name: Run flake8
        run: flake8 app evals tests mock_llm --max-line-length 100

      - name: Run evaluation regression gate
        env:
          PROMPT_VERSION: v2
        run: python evals/run_evals.py --baseline report-v2.json



